<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>我的心情 My Feeling</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      touch-action: none;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url(imgs/bg.jpg);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      /* filter: brightness(0.85) contrast(0.95); */
      z-index: -1;
    }

    .emoji-pool {
      width: 95vw;
      height: 40vh;
      position: relative;
      margin-top: 10px;
    }

    .floating-emoji {
      width: 100px;
      height: 100px;
      cursor: grab;
      user-select: none;
      position: absolute;
      top: 0;
      left: 0;
      filter: drop-shadow(2px 2px 6px rgba(255, 255, 255, 0.9)) drop-shadow(2px 6px 10px rgba(0, 0, 0, 0.35));
      transition: transform 0.15s ease-in-out;
      z-index: 5;
    }

    .floating-emoji.dragging {
      cursor: grabbing;
      transform: scale(1.3);
      z-index: 9999 !important;
      position: fixed !important;
      pointer-events: none !important;
    }

    /* Jar Overlay GIF style */
    .jar-emoji {
      position: absolute;
      width: 35px;
      height: 35px;
      top: 0;
      left: 0;
      pointer-events: none;
      /* filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35)); */
      transform-origin: center center;
    }

    .jars-container {
      display: flex;
      justify-content: center;
      gap: 5vw;
      width: 90vw;
      flex-grow: 1;
      align-items: flex-end;
      padding-bottom: 40px;
    }

    .jar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .jar-label {
      font-size: 3rem;
      font-weight: 900;
      color: #ffffff;

      /* Crisp 3D border stroke + sharp shadow */
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000,
        0px 3px 6px rgba(0, 0, 0, 0.9);

      margin-bottom: 8px;

      /* Optimize font edge crispness across browsers */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      letter-spacing: 1px;
    }

    .jar {
      width: 32vw;
      max-width: 680px;
      height: 50vh;
      max-height: 600px;
      position: relative;
      /* overflow: hidden; */
      transition: transform 0.2s;
      background-image: url('imgs/bottle.gif');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25));
      /* border: 1px solid black; */
    }

    .jar.drag-over {
      transform: scale(1.05);
    }

    .counter {
      position: absolute;
      bottom: -15px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.25);
    }

    .btn-reset {
      position: absolute;
      bottom: 12px;
      right: 20px;
      padding: 8px 16px;
      background: #ffffff;
      color: #0284c7;
      border: 2px solid #0284c7;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>

  <div class="emoji-pool" id="emojiPool"></div>

  <div class="jars-container">
    <div class="jar-wrapper">
      <div class="jar-label">開心</div>
      <div class="jar" id="jar-happy" data-category="happy"></div>
      <div class="counter" id="count-happy">0</div>
    </div>

    <div class="jar-wrapper">
      <div class="jar-label">不開心</div>
      <div class="jar" id="jar-other" data-category="other"></div>
      <div class="counter" id="count-other">0</div>
    </div>
  </div>

  <button class="btn-reset" onclick="initBoard()">重設</button>

  <script>
    const emojiList = [
      'imgs/emoji1.gif',
      'imgs/emoji2.gif',
      'imgs/emoji3.gif',
      'imgs/emoji4.gif',
      'imgs/emoji5.gif',
      'imgs/emoji6.gif',
      'imgs/emoji7.gif'
    ];

    let movingItems = [];
    let animationFrameId = null;
    const EMOJI_RADIUS = 45;
    const TARGET_SPEED = 1.2; // Fixed floating speed

    const jarPhysics = {};

    window.onload = initBoard;
    window.onresize = handleResize;

    function initBoard() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      const pool = document.getElementById('emojiPool');
      pool.innerHTML = '';

      document.querySelectorAll('.counter').forEach(el => el.textContent = '0');

      setupJarPhysics('jar-happy');
      setupJarPhysics('jar-other');

      movingItems = [];
      const poolBounds = pool.getBoundingClientRect();

      emojiList.forEach((imgSrc, index) => {
        const img = document.createElement('img');
        img.classList.add('floating-emoji');
        img.src = imgSrc;

        const angle = Math.random() * Math.PI * 2;
        const item = {
          element: img,
          src: imgSrc,
          x: (index + 0.5) * (poolBounds.width / emojiList.length) - EMOJI_RADIUS,
          y: Math.random() * Math.max(10, poolBounds.height - 90),
          vx: Math.cos(angle) * TARGET_SPEED,
          vy: Math.sin(angle) * TARGET_SPEED,
          radius: EMOJI_RADIUS,
          isDragging: false
        };

        img.addEventListener('pointerdown', (e) => startPointerDrag(e, item));

        pool.appendChild(img);
        movingItems.push(item);
      });

      animate();
    }

    function startPointerDrag(e, item) {
      item.isDragging = true;
      item.element.classList.add('dragging');

      const pointerId = e.pointerId;
      item.element.setPointerCapture(pointerId);

      let lastX = e.clientX;
      let lastY = e.clientY;

      const onPointerMove = (moveEvt) => {
        if (moveEvt.pointerId !== pointerId || !item.isDragging) return;
        lastX = moveEvt.clientX;
        lastY = moveEvt.clientY;

        item.element.style.left = (lastX - item.radius) + 'px';
        item.element.style.top = (lastY - item.radius) + 'px';
        checkJarHover(lastX, lastY, item.element);
      };

      const onPointerUp = (upEvt) => {
        if (upEvt.pointerId !== pointerId) return;

        item.isDragging = false;
        item.element.classList.remove('dragging');

        if (item.element.hasPointerCapture(pointerId)) {
          item.element.releasePointerCapture(pointerId);
        }

        item.element.removeEventListener('pointermove', onPointerMove);
        item.element.removeEventListener('pointerup', onPointerUp);
        item.element.removeEventListener('pointercancel', onPointerUp);

        // Briefly hide item to fetch underlying DOM element
        item.element.style.display = 'none';
        const dropTarget = document.elementFromPoint(lastX, lastY);
        item.element.style.display = '';

        const targetJar = dropTarget ? dropTarget.closest('.jar') : null;

        if (targetJar) {
          const rect = targetJar.getBoundingClientRect();
          const dropXRatio = (lastX - rect.left) / rect.width;
          addBouncingEmojiToJar(targetJar.id, item.src, dropXRatio);

          const poolBounds = document.getElementById('emojiPool').getBoundingClientRect();
          item.x = Math.random() * (poolBounds.width - 90);
          item.y = Math.random() * (poolBounds.height - 90);
          const angle = Math.random() * Math.PI * 2;
          item.vx = Math.cos(angle) * TARGET_SPEED;
          item.vy = Math.sin(angle) * TARGET_SPEED;
        }

        clearJarHovers();
      };

      item.element.addEventListener('pointermove', onPointerMove);
      item.element.addEventListener('pointerup', onPointerUp);
      item.element.addEventListener('pointercancel', onPointerUp);
    }

    function checkJarHover(clientX, clientY, draggedEl) {
      clearJarHovers();

      // Temporarily disable display to detect elements underneath on touch screens
      if (draggedEl) draggedEl.style.display = 'none';
      const dropTarget = document.elementFromPoint(clientX, clientY);
      if (draggedEl) draggedEl.style.display = '';

      const targetJar = dropTarget ? dropTarget.closest('.jar') : null;
      if (targetJar) {
        targetJar.classList.add('drag-over');
      }
    }

    function clearJarHovers() {
      document.querySelectorAll('.jar').forEach(jar => jar.classList.remove('drag-over'));
    }

    function setupJarPhysics(jarId) {
      const container = document.getElementById(jarId);
      container.innerHTML = '';

      if (jarPhysics[jarId]) {
        Matter.Engine.clear(jarPhysics[jarId].engine);
        delete jarPhysics[jarId];
      }

      const width = container.clientWidth;
      const height = container.clientHeight;

      // Measure dynamic emoji radius to offset walls accurately
      const tempImg = document.createElement('img');
      tempImg.classList.add('jar-emoji');
      tempImg.style.visibility = 'hidden';
      container.appendChild(tempImg);
      const emojiRadius = (tempImg.clientWidth || 35) / 2;
      container.removeChild(tempImg);

      const { Engine, Bodies, Composite, Events } = Matter;

      const engine = Engine.create();
      engine.world.gravity.y = 1.2;

      const wallThickness = 60;

      // 1. Proportional Ground: Lifts by 8% of jar height + half the emoji radius
      const groundY = height * 0.92 - emojiRadius;
      const ground = Bodies.rectangle(width / 2, groundY + wallThickness / 2, width * 0.7, wallThickness, { isStatic: true });

      // 2. Proportional Walls: Pads inward by 15% of width + emoji radius to fit glass curve
      const wallPadding = width * 0.15 + emojiRadius;
      const leftWall = Bodies.rectangle(wallPadding - wallThickness / 2, height * 0.55, wallThickness, height * 0.7, { isStatic: true });
      const rightWall = Bodies.rectangle(width - wallPadding + wallThickness / 2, height * 0.55, wallThickness, height * 0.7, { isStatic: true });

      // 3. Proportional Funnel Lips: Keeps emojis inside the top rim
      const leftLip = Bodies.rectangle(width * 0.2, height * 0.2, width * 0.25, 20, {
        isStatic: true,
        angle: Math.PI / 6
      });
      const rightLip = Bodies.rectangle(width * 0.8, height * 0.2, width * 0.25, 20, {
        isStatic: true,
        angle: -Math.PI / 6
      });

      Composite.add(engine.world, [ground, leftWall, rightWall, leftLip, rightLip]);

      Events.on(engine, 'afterUpdate', () => {
        const bodies = Composite.allBodies(engine.world);
        bodies.forEach(body => {
          if (body.domElement) {
            const x = body.position.x - body.circleRadius;
            const y = body.position.y - body.circleRadius;
            body.domElement.style.transform = `translate(${x}px, ${y}px) rotate(${body.angle}rad)`;
          }
        });
      });

      function step() {
        if (jarPhysics[jarId]) {
          Engine.update(engine, 1000 / 60);
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);

      jarPhysics[jarId] = { engine, bodiesCount: 0 };
    }

    function addBouncingEmojiToJar(jarId, imgSrc, dropXRatio) {
      const p = jarPhysics[jarId];
      if (!p) return;

      const { Bodies, Composite } = Matter;
      const container = document.getElementById(jarId);
      const width = container.clientWidth;

      const imgEl = document.createElement('img');
      imgEl.src = imgSrc;
      imgEl.classList.add('jar-emoji');
      container.appendChild(imgEl);

      // Measure rendered emoji dimensions
      const cssWidth = imgEl.clientWidth || 35;
      const ballRadius = cssWidth / 2;

      const spawnX = Math.max(ballRadius * 2, Math.min(width - ballRadius * 2, dropXRatio * width));

      const ball = Bodies.circle(spawnX, 20, ballRadius, {
        restitution: 0.65,
        friction: 0.3,
        density: 0.05
      });

      ball.domElement = imgEl;
      Composite.add(p.engine.world, ball);

      p.bodiesCount++;
      const category = container.getAttribute('data-category');
      document.getElementById(`count-${category}`).textContent = p.bodiesCount;
    }

    function animate() {
      const pool = document.getElementById('emojiPool');
      const bounds = pool.getBoundingClientRect();

      movingItems.forEach(item => {
        if (item.isDragging) return;

        item.x += item.vx;
        item.y += item.vy;

        if (item.x <= 0) {
          item.x = 0;
          item.vx = Math.abs(item.vx);
        } else if (item.x >= bounds.width - item.radius * 2) {
          item.x = bounds.width - item.radius * 2;
          item.vx = -Math.abs(item.vx);
        }

        if (item.y <= 0) {
          item.y = 0;
          item.vy = Math.abs(item.vy);
        } else if (item.y >= bounds.height - item.radius * 2) {
          item.y = bounds.height - item.radius * 2;
          item.vy = -Math.abs(item.vy);
        }
      });

      for (let i = 0; i < movingItems.length; i++) {
        for (let j = i + 1; j < movingItems.length; j++) {
          const a = movingItems[i];
          const b = movingItems[j];

          if (a.isDragging || b.isDragging) continue;

          const dx = (b.x + b.radius) - (a.x + a.radius);
          const dy = (b.y + b.radius) - (a.y + a.radius);
          const distance = Math.hypot(dx, dy);
          const minDistance = a.radius + b.radius;

          if (distance < minDistance) {
            const overlap = minDistance - distance;
            const nx = dx / distance;
            const ny = dy / distance;

            a.x -= nx * overlap * 0.5;
            a.y -= ny * overlap * 0.5;
            b.x += nx * overlap * 0.5;
            b.y += ny * overlap * 0.5;

            const kx = a.vx - b.vx;
            const ky = a.vy - b.vy;
            const p = 2 * (nx * kx + ny * ky) / 2;

            a.vx -= p * nx;
            a.vy -= p * ny;
            b.vx += p * nx;
            b.vy += p * ny;

            // Maintain constant speed velocity vector
            const speedA = Math.hypot(a.vx, a.vy) || 1;
            a.vx = (a.vx / speedA) * TARGET_SPEED;
            a.vy = (a.vy / speedA) * TARGET_SPEED;

            const speedB = Math.hypot(b.vx, b.vy) || 1;
            b.vx = (b.vx / speedB) * TARGET_SPEED;
            b.vy = (b.vy / speedB) * TARGET_SPEED;
          }
        }
      }

      movingItems.forEach(item => {
        if (!item.isDragging) {
          item.element.style.left = item.x + 'px';
          item.element.style.top = item.y + 'px';
        }
      });

      animationFrameId = requestAnimationFrame(animate);
    }

    function handleResize() {
      const pool = document.getElementById('emojiPool');
      const bounds = pool.getBoundingClientRect();
      movingItems.forEach(item => {
        if (item.x > bounds.width - item.radius * 2) item.x = bounds.width - item.radius * 2;
        if (item.y > bounds.height - item.radius * 2) item.y = bounds.height - item.radius * 2;
      });
    }
  </script>
</body>

</html>
